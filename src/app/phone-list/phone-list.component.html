<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3</title>
</head>
<body>
<div>
  <table>
    <tbody>
    <tr *ngFor="let phone of phoneList; let i = index"
        [ngClass]="{'even-item': i % 2 === 0, 'odd-item': i % 2 !== 0}">
      <td>
        <app-phone-list-item [phone]="phone"></app-phone-list-item>
      </td>
      <td>
        <button (click)="onDelete(phone.id)">Delete</button>
        <button (click)="onEdit(phone.id)">Edit</button>

      </td>
    </tr>
    </tbody>
  </table>
  <div *ngIf="error" class="error">{{ error }}</div>
</div>
</body>

</html>
